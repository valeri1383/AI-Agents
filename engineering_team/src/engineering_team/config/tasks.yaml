  description: >
    Implement comprehensive data visualization and analytics functionality for the appointment system.
    Create interactive charts for appointment trends, doctor utilization, patient patterns, and system metrics.
    The code must be COMPLETE, include ALL necessary imports, and integrate seamlessly with the main application.
    Test your code using the code interpreter to ensure it works before submitting.
  expected_output: >
    Complete visualization module with methods for: create_appointment_charts(), generate_doctor_utilization_graphs(),
    plot_booking_patterns(), create_patient_demographics(), generate_daily_reports(), create_interactive_dashboard().
    Include plotly-based charts that provide real-time data insights and can be integrated with the main application.
    The code must include ALL necessary imports and be ready to run immediately.
    CRITICAL: Your response must start with "import" or "from" - NO markdown, NO code blocks, NO backticks, NO explanations.
    Start immediately with Python code. Do not write ```python or ``` anywhere in your response.
    Output ONLY executable Python code that can be saved directly to a .py file.
  agent: visualization_specialist
  context:
    - code_task
  output_file: output/visualization_module.py